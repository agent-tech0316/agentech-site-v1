name: Import Dropbox News

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-news:
    runs-on: ubuntu-latest
    env:
      DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
      DROPBOX_NEWS_SHARED_LINK: ${{ secrets.DROPBOX_NEWS_SHARED_LINK }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Import Dropbox news
        run: npm run import:news

      - name: Remove unreferenced news assets
        run: npm run cleanup:news:apply

      - name: Build site
        run: npm run build

      - name: Commit imported news and asset cleanup
        run: |
          git add data/news-entries.json data/news-imports.json public/assets/news
          if git diff --cached --quiet; then
            echo "No news changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import Dropbox news and clean obsolete assets"
          git push
